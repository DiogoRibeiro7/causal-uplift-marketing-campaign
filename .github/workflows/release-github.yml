name: GitHub Release Assets

# A stable GitHub Release is the sole distribution channel for this project.
# Nothing is sent to PyPI or another package registry.
on:
  release:
    types: [published]

jobs:
  assets:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Build and validate the exact source snapshot archived by Zenodo.
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and metadata tools
        run: python -m pip install --upgrade build twine pyyaml
      - name: Verify Zenodo and citation metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_citation_metadata.py --tag "$RELEASE_TAG"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify tag matches package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_release.py --tag "$RELEASE_TAG" --dist dist
      - name: Attach validated distributions to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY"
