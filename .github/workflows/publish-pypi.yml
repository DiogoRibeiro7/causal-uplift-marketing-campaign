name: Publish to PyPI

# Publishing requires an explicit GitHub Release, never a push or pull request.
on:
  release:
    types: [published]

jobs:
  build:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and metadata tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify tag matches both distributions and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_release.py --tag "$RELEASE_TAG" --dist dist
      - name: Store release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event.release.prerelease == false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/causal-uplift-marketing-campaign/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
