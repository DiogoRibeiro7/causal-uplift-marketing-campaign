[tool.poetry]
name = "causal-uplift-marketing-campaign"
version = "0.1.0"
description = "Uplift modelling and campaign policy evaluation for marketing incrementality."
authors = ["Diogo Ribeiro <diogo_dj@hotmail.com>"]
readme = "README.md"
packages = [{ include = "uplift_marketing", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = "^1.4.0"
matplotlib = "^3.8.0"
joblib = "^1.3.0"
kaggle = "^1.6.0"
typer = "^0.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"
mypy = "^1.10.0"
nbval = "^0.11.0"

[tool.poetry.group.optional.dependencies]
xgboost = "^2.0.0"
lightgbm = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells often import after environment setup and reuse imports in
# later cells, so the module-level import and unused-import rules do not fit.
"notebooks/*.ipynb" = ["E402", "I001", "F401", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
